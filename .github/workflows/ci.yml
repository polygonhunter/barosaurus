name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # The same linter the community-plugin review runs. Errors fail the build;
      # the warnings left standing are deliberate and explained in CLAUDE.md.
      - run: npm run lint
      - run: npm test
      - run: npm run build

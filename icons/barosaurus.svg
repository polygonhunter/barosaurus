<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Barosaurus">
  <defs>
    <linearGradient id="ba-tile" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6b9d"/>
      <stop offset="1" stop-color="#d1275f"/>
    </linearGradient>
    <linearGradient id="ba-sheen" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#ba-tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#ba-sheen)"/>

  <!-- minimal geometric sauropod (white) -->
  <g fill="#ffffff">
    <!-- tail -->
    <path d="M158 268 L92 246 L118 292 Z"/>
    <!-- body capsule -->
    <rect x="146" y="238" width="206" height="86" rx="43"/>
    <!-- legs -->
    <rect x="192" y="310" width="40" height="96" rx="20"/>
    <rect x="278" y="310" width="40" height="96" rx="20"/>
    <!-- back bumps -->
    <circle cx="204" cy="234" r="12"/>
    <circle cx="246" cy="228" r="12"/>
    <circle cx="288" cy="234" r="12"/>
  </g>

  <!-- the long neck: the whole reason this dinosaur is the mascot -->
  <path d="M330 258 C 362 206, 376 164, 372 122" stroke="#ffffff" stroke-width="46" stroke-linecap="round" fill="none"/>

  <!-- head -->
  <g fill="#ffffff">
    <circle cx="372" cy="112" r="34"/>
    <!-- snout -->
    <rect x="366" y="98" width="58" height="28" rx="14"/>
  </g>

  <!-- eye -->
  <circle cx="386" cy="104" r="7" fill="#8a0f3a"/>

  <!-- one bar, every action: the dinosaur stands on the command bar -->
  <rect x="104" y="392" width="304" height="60" rx="30" fill="#7ef0d0"/>
  <!-- caret and the query you just typed -->
  <rect x="134" y="408" width="6" height="28" rx="3" fill="#8a0f3a"/>
  <rect x="156" y="418" width="86" height="8" rx="4" fill="#8a0f3a" opacity="0.55"/>
</svg>
